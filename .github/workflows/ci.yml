name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify go.mod tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build ./...

  fuzz-packages:
    name: fuzz packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # Every package with a Fuzz* function becomes one fuzz job, so new
      # targets and packages need no edit here.
      - name: list packages with fuzz targets
        id: list
        run: |
          set -o pipefail
          packages=$(go test -list '^Fuzz' -json ./... |
            jq -s -c '[.[] | select(.Action == "output" and (.Output | startswith("Fuzz"))) | .Package] | unique')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz (${{ matrix.package }})
    needs: fuzz-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.fuzz-packages.outputs.packages) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # Go fuzzes one target per invocation, so every Fuzz* function in
      # the package is listed and run in turn.
      # -fuzzminimizetime=0: 30s runs keep no corpus, minimizing starves
      # slow targets, and an unminimized crasher still reproduces.
      - name: go test -fuzz
        env:
          PKG: ${{ matrix.package }}
        run: |
          failed=0
          for target in $(go test -list '^Fuzz' "$PKG" | grep '^Fuzz'); do
            echo "::group::$target"
            if ! go test -run='^$' -fuzz="^${target}\$" -fuzztime=30s -fuzzminimizetime=0 "$PKG"; then
              echo "::error::$target failed in $PKG"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      # Artifact names can't contain '/', and each matrix job needs its own.
      - name: crasher artifact name
        id: artifact
        if: failure()
        env:
          PKG: ${{ matrix.package }}
        run: echo "name=fuzz-crashers-${PKG//\//-}" >> "$GITHUB_OUTPUT"

      # A failing input is saved under the package's testdata/fuzz/<target>/.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  build-matrix:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: freebsd
            goarch: amd64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "yamaha-${GOOS}-${GOARCH}${ext}" ./cmd/yamaha
          ls -la yamaha-*

      - uses: actions/upload-artifact@v7
        with:
          name: yamaha-${{ matrix.goos }}-${{ matrix.goarch }}
          path: yamaha-*
          if-no-files-found: error
          retention-days: 7
